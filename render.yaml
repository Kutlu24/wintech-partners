# Static site: the plain HTML pages, published without any build step.
services:
  - type: web
    name: wintech-partners
    runtime: static
    buildCommand: rm -rf public && mkdir -p public && cp index.html services.html about.html cybersecurity.html contact.html style.css public/ && cp -R archive public/
    staticPublishPath: ./public
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
